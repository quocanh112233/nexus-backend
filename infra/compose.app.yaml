services:
  identity-service:
    stop_grace_period: 40s
    image: ghcr.io/quocanh112233/nexus-identity-service:${TAG:-latest}
    build:
      context: ..
      dockerfile: services/identity-service/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://postgres:5432/nexus?currentSchema=identity
      DB_USER: identity_svc
      DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?}
      JWT_PRIVATE_KEY_PATH: /run/secrets/jwt_private_key
      JWT_KEY_ID: ${JWT_KEY_ID:-nexus-1}
      # COOKIE_SECURE=false vì demo local chạy HTTP; bật true khi có HTTPS
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      # ponytail: key Cloudinary rỗng = endpoint avatar chưa dùng được, điền .env khi cần
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      CLOUDINARY_UPLOAD_PRESET: ${CLOUDINARY_UPLOAD_PRESET_AVATAR:-}
      CLOUDINARY_FOLDER_ROOT: ${CLOUDINARY_FOLDER_ROOT:-nexus-dev}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_ADMIN_USER:?}
      RABBITMQ_PASSWORD: ${RABBITMQ_ADMIN_PASSWORD:?}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_ENDPOINT:-}
    secrets:
      - jwt_private_key
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    deploy:
      resources:
        limits: { memory: 512m }
  community-service:
    stop_grace_period: 40s
    image: ghcr.io/quocanh112233/nexus-community-service:${TAG:-latest}
    build:
      context: ..
      dockerfile: services/community-service/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://postgres:5432/nexus?currentSchema=community
      DB_USER: community_svc
      DB_PASSWORD: ${COMMUNITY_DB_PASSWORD:?}
      JWKS_URI: http://identity-service:8081/.well-known/jwks.json
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_ADMIN_USER:?}
      RABBITMQ_PASSWORD: ${RABBITMQ_ADMIN_PASSWORD:?}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_ENDPOINT:-}
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    deploy:
      resources:
        limits: { memory: 512m }
  messaging-service:
    stop_grace_period: 40s
    image: ghcr.io/quocanh112233/nexus-messaging-service:${TAG:-latest}
    build:
      context: ..
      dockerfile: services/messaging-service/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://postgres:5432/nexus?currentSchema=messaging
      DB_USER: messaging_svc
      DB_PASSWORD: ${MESSAGING_DB_PASSWORD:?}
      JWKS_URI: http://identity-service:8081/.well-known/jwks.json
      COMMUNITY_GRPC_TARGET: dns:///community-service:9092
      REDIS_HOST: redis
      # ponytail: key Cloudinary rỗng = upload đính kèm chưa dùng được, điền .env khi cần
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      CLOUDINARY_UPLOAD_PRESET_ATTACHMENT: ${CLOUDINARY_UPLOAD_PRESET_ATTACHMENT:-}
      CLOUDINARY_FOLDER_ROOT: ${CLOUDINARY_FOLDER_ROOT:-nexus-dev}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_ADMIN_USER:?}
      RABBITMQ_PASSWORD: ${RABBITMQ_ADMIN_PASSWORD:?}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_ENDPOINT:-}
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }
    deploy:
      resources:
        limits: { memory: 512m }
  api-gateway:
    image: ghcr.io/quocanh112233/nexus-api-gateway:${TAG:-latest}
    build:
      context: ..
      dockerfile: gateways/api-gateway/Dockerfile
    environment:
      JWKS_URI: http://identity-service:8081/.well-known/jwks.json
      IDENTITY_URI: http://identity-service:8081
      COMMUNITY_URI: http://community-service:8082
      MESSAGING_URI: http://messaging-service:8083
      REDIS_HOST: redis
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_ENDPOINT:-}
    # Cổng duy nhất publish ra host; identity, community và messaging chỉ truy cập được qua gateway
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      identity-service: { condition: service_healthy }
      community-service: { condition: service_healthy }
      messaging-service: { condition: service_healthy }
      redis: { condition: service_healthy }
    deploy:
      resources:
        limits: { memory: 512m }
secrets:
  jwt_private_key:
    file: ./secrets/jwt-private.pem
