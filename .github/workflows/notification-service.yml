name: notification-service
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: &paths
      - "services/notification-service/**"
      - "libs/**"
      - "proto/**"
      - "pom.xml"
      - "services/pom.xml"
      - ".mvn/**"
      - "mvnw"
      - ".github/workflows/notification-service.yml"
      - ".github/workflows/_backend-service.yml"
  pull_request:
    paths: *paths
jobs:
  build:
    uses: ./.github/workflows/_backend-service.yml
    with:
      module: services/notification-service
      image: nexus-notification-service
    permissions:
      contents: read
      packages: write
      security-events: write
