name: proto
on:
  push:
    branches: [main]
    paths: ["proto/**"]
  pull_request:
    paths: ["proto/**"]
jobs:
  buf:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Base của PR chưa có proto/ (PR đầu tiên thêm proto) thì không có gì để so, bỏ qua breaking
      - id: base
        if: github.event_name == 'pull_request'
        run: |
          if git cat-file -e "${{ github.event.pull_request.base.sha }}:proto" 2>/dev/null; then
            echo "has_proto=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_proto=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: bufbuild/buf-action@37ac33d8960807670a6e9719080e885197b09cc6 # v1.7.0
        with:
          input: proto
          lint: true
          breaking: ${{ github.event_name == 'pull_request' && steps.base.outputs.has_proto == 'true' && !contains(github.event.pull_request.labels.*.name, 'buf skip breaking') }}
          # breaking mặc định chỉ chạy trên pull_request; so với commit base của PR trong checkout cục bộ (repo private nên không dùng clone_url mặc định)
          breaking_against: ".git#commit=${{ github.event.pull_request.base.sha }},subdir=proto"
          format: false
          push: false
          archive: false
