name: api-gateway
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: &paths
      - "gateways/api-gateway/**"
      - "libs/**"
      - "proto/**"
      - "pom.xml"
      - "gateways/pom.xml"
      - ".mvn/**"
      - "mvnw"
      - ".github/workflows/api-gateway.yml"
      - ".github/workflows/_backend-service.yml"
  pull_request:
    paths: *paths
jobs:
  build:
    uses: ./.github/workflows/_backend-service.yml
    with:
      module: gateways/api-gateway
      image: nexus-api-gateway
    permissions:
      contents: read
      packages: write
      security-events: write
