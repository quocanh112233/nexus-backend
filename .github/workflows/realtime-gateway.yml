name: realtime-gateway
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: &paths
      - "services/realtime-gateway/**"
      - "libs/**"
      - "proto/**"
      - "pom.xml"
      - "services/pom.xml"
      - ".mvn/**"
      - "mvnw"
      - ".github/workflows/realtime-gateway.yml"
      - ".github/workflows/_backend-service.yml"
  pull_request:
    paths: *paths
jobs:
  build:
    uses: ./.github/workflows/_backend-service.yml
    with:
      module: services/realtime-gateway
      image: nexus-realtime-gateway
    permissions:
      contents: read
      packages: write
      security-events: write
