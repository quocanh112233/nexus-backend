name: identity-service
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: &paths
      - "services/identity-service/**"
      - "libs/**"
      - "pom.xml"
      - "services/pom.xml"
      - ".mvn/**"
      - "mvnw"
      - ".github/workflows/identity-service.yml"
      - ".github/workflows/_backend-service.yml"
  pull_request:
    paths: *paths
jobs:
  build:
    uses: ./.github/workflows/_backend-service.yml
    with:
      module: services/identity-service
      image: nexus-identity-service
    permissions:
      contents: read
      packages: write
      security-events: write
