server:
  port: 8084

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  application:
    name: realtime-gateway
  # Service này chỉ là client gRPC, không mở server gRPC
  grpc:
    server:
      enabled: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:nexus}
    # Broker treo không được chặn lâu: giới hạn thời gian kết nối và RPC kênh
    connection-timeout: 2s
    channel-rpc-timeout: 5s
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        prefetch: 20
        acknowledge-mode: auto
        default-requeue-rejected: false
        observation-enabled: true

management:
  health:
    rabbit:
      enabled: false
  # Lấy mẫu 100% trace ở local; exporter OTLP chỉ bật khi đặt OTEL_EXPORTER_OTLP_ENDPOINT
  tracing:
    sampling:
      probability: 1.0
  server:
    port: 8184
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health

app:
  # Định danh instance cho tên queue riêng, rỗng thì sinh UUID lúc khởi động
  instance-id: ${INSTANCE_ID:${HOSTNAME:}}
  # Chu kỳ gửi heartbeat danh sách session cho Presence
  presence:
    heartbeat-interval: 30s
  # Origin được phép mở WebSocket, phân tách bằng dấu phẩy
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  jwt:
    jwks-uri: ${JWKS_URI}
    jwks-connect-timeout: ${JWKS_CONNECT_TIMEOUT:2s}
    jwks-read-timeout: ${JWKS_READ_TIMEOUT:5s}
    issuer: nexus-identity
    audience: nexus
  grpc:
    # Token của realtime-gateway khi gọi Messaging và Community, lấy từ env
    service-token: ${GRPC_TOKEN_REALTIME:}
    community:
      target: ${COMMUNITY_GRPC_TARGET:dns:///localhost:9092}
    messaging:
      target: ${MESSAGING_GRPC_TARGET:dns:///localhost:9093}

logging:
  structured:
    format:
      console: ecs
