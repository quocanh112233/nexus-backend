server:
  port: 8083

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  task:
    scheduling:
      shutdown:
        await-termination: true
        await-termination-period: 20s
  application:
    name: messaging-service
  grpc:
    server:
      port: ${GRPC_PORT:9093}
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  flyway:
    schemas: messaging
    default-schema: messaging
    create-schemas: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: messaging
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 300ms
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:nexus}
    # Broker treo không được chặn relay lâu: giới hạn thời gian kết nối và RPC kênh
    connection-timeout: 2s
    channel-rpc-timeout: 5s
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        prefetch: 20
        acknowledge-mode: auto
        default-requeue-rejected: false
        observation-enabled: true

nexus:
  messaging:
    relay:
      enabled: ${RELAY_ENABLED:true}
      exchange: messaging.events

management:
  health:
    rabbit:
      enabled: false
    # Redis chỉ là cache fail-open nên không để nó làm readiness của service fail
    redis:
      enabled: false
  # Lấy mẫu 100% trace ở local; exporter OTLP chỉ bật khi đặt OTEL_EXPORTER_OTLP_ENDPOINT
  tracing:
    sampling:
      probability: 1.0
  server:
    port: 8183
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health

app:
  cache:
    permission-ttl: 60s
  jwt:
    jwks-uri: ${JWKS_URI}
    jwks-connect-timeout: ${JWKS_CONNECT_TIMEOUT:2s}
    jwks-read-timeout: ${JWKS_READ_TIMEOUT:5s}
    issuer: nexus-identity
    audience: nexus
  grpc:
    community:
      target: ${COMMUNITY_GRPC_TARGET:dns:///localhost:9092}
      deadline: 300ms
      circuit-breaker:
        sliding-window-size: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-calls-in-half-open-state: 3
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
    upload-preset: ${CLOUDINARY_UPLOAD_PRESET_ATTACHMENT:}
    folder-root: ${CLOUDINARY_FOLDER_ROOT:nexus-dev}
    api-base-url: ${CLOUDINARY_API_BASE_URL:https://api.cloudinary.com/v1_1}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  structured:
    format:
      console: ecs
