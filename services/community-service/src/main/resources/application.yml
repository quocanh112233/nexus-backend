server:
  port: 8082

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  task:
    scheduling:
      shutdown:
        await-termination: true
        await-termination-period: 20s
  application:
    name: community-service
  grpc:
    server:
      port: ${GRPC_PORT:9092}
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  flyway:
    schemas: community
    default-schema: community
    create-schemas: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: community
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:nexus}
    # Broker treo không được chặn relay lâu: giới hạn thời gian kết nối và RPC kênh
    connection-timeout: 2s
    channel-rpc-timeout: 5s
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        prefetch: 20
        acknowledge-mode: auto
        default-requeue-rejected: false
        observation-enabled: true

nexus:
  messaging:
    relay:
      enabled: ${RELAY_ENABLED:true}
      exchange: community.events

management:
  health:
    # Broker chết không được làm readiness của service fail
    rabbit:
      enabled: false
  # Lấy mẫu 100% trace ở local; exporter OTLP chỉ bật khi đặt OTEL_EXPORTER_OTLP_ENDPOINT
  tracing:
    sampling:
      probability: 1.0
  server:
    port: 8182
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health

app:
  jwt:
    jwks-uri: ${JWKS_URI}
    jwks-connect-timeout: ${JWKS_CONNECT_TIMEOUT:2s}
    jwks-read-timeout: ${JWKS_READ_TIMEOUT:5s}
    issuer: nexus-identity
    audience: nexus
  grpc:
    # Token từ env, trống thì caller bị vô hiệu; allowlist full method name cho từng caller
    service-callers:
      realtime-gateway:
        token: ${GRPC_TOKEN_REALTIME:}
        methods:
          - nexus.community.v1.PermissionService/CheckServerMembership
      presence-service:
        token: ${GRPC_TOKEN_PRESENCE:}
        methods:
          - nexus.community.v1.PermissionService/ListServerIdsForUser
      messaging-service:
        token: ${GRPC_TOKEN_MESSAGING:}
        methods:
          - nexus.community.v1.PermissionService/CheckChannelPermissions

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  structured:
    format:
      console: ecs
