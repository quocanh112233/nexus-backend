server:
  port: 8086

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  task:
    scheduling:
      shutdown:
        await-termination: true
        await-termination-period: 20s
  application:
    name: notification-service
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  flyway:
    schemas: notification
    default-schema: notification
    create-schemas: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: notification
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:nexus}
    # Broker treo không được chặn relay lâu: giới hạn thời gian kết nối và RPC kênh
    connection-timeout: 2s
    channel-rpc-timeout: 5s
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        prefetch: 20
        acknowledge-mode: auto
        default-requeue-rejected: false
        observation-enabled: true

nexus:
  messaging:
    relay:
      enabled: ${RELAY_ENABLED:true}
      exchange: notification.events

management:
  health:
    rabbit:
      enabled: false
  # Lấy mẫu 100% trace ở local; exporter OTLP chỉ bật khi đặt OTEL_EXPORTER_OTLP_ENDPOINT
  tracing:
    sampling:
      probability: 1.0
  server:
    port: 8186
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health

app:
  jwt:
    jwks-uri: ${JWKS_URI}
    jwks-connect-timeout: ${JWKS_CONNECT_TIMEOUT:2s}
    jwks-read-timeout: ${JWKS_READ_TIMEOUT:5s}
    issuer: nexus-identity
    audience: nexus

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  structured:
    format:
      console: ecs
