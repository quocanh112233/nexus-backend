server:
  port: 8081

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  task:
    scheduling:
      shutdown:
        await-termination: true
        await-termination-period: 20s
  application:
    name: identity-service
  grpc:
    server:
      port: ${GRPC_PORT:9091}
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  flyway:
    schemas: identity
    default-schema: identity
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: identity
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:nexus}
    # Broker treo không được chặn relay lâu: giới hạn thời gian kết nối và RPC kênh
    connection-timeout: 2s
    channel-rpc-timeout: 5s
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        prefetch: 20
        acknowledge-mode: auto
        default-requeue-rejected: false
        observation-enabled: true

nexus:
  messaging:
    relay:
      enabled: ${RELAY_ENABLED:true}
      exchange: identity.events

management:
  health:
    # Broker chết không được làm readiness của service fail
    rabbit:
      enabled: false
  # Lấy mẫu 100% trace ở local; exporter OTLP chỉ bật khi đặt OTEL_EXPORTER_OTLP_ENDPOINT
  tracing:
    sampling:
      probability: 1.0
  server:
    port: 8181
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health

app:
  grpc:
    # Token từ env, trống thì caller bị vô hiệu; allowlist full method name cho từng caller
    service-callers:
      messaging-service:
        token: ${GRPC_TOKEN_MESSAGING:}
        methods:
          - nexus.identity.v1.UserService/GetUser
  jwt:
    private-key-path: ${JWT_PRIVATE_KEY_PATH:}
    key-id: ${JWT_KEY_ID:nexus-1}
    issuer: nexus-identity
    audience: nexus
    access-ttl: 15m
  refresh:
    ttl: 30d
  cookie:
    secure: ${COOKIE_SECURE:true}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
    upload-preset: ${CLOUDINARY_UPLOAD_PRESET:}
    folder-root: ${CLOUDINARY_FOLDER_ROOT:nexus-dev}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  structured:
    format:
      console: ecs
